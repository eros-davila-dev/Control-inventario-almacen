name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

# Solo lectura del repositorio: el flujo no publica artefactos ni escribe nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  migraciones:
    name: Migraciones Flyway contra PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sgai
          POSTGRES_USER: sgai
          POSTGRES_PASSWORD: sgai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sgai -d sgai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Verifica que las migraciones apliquen limpias sobre una base vacia y que
      # el esquema resultante valide contra el modelo JPA (ddl-auto: validate).
      - name: Aplicar migraciones y validar el esquema
        env:
          SPRING_PROFILES_ACTIVE: prod
          SGAI_DB_URL: jdbc:postgresql://localhost:5432/sgai
          SGAI_DB_USER: sgai
          SGAI_DB_PASSWORD: sgai
          SGAI_JWT_SECRET: secreto-solo-para-integracion-continua-de-al-menos-64-caracteres-xx
        run: |
          mvn -B -q package -DskipTests
          java -jar target/*.jar > arranque.log 2>&1 &
          PID=$!
          for intento in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Migraciones aplicadas y esquema validado contra PostgreSQL 17."
              kill $PID
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "El backend termino durante el arranque:"; cat arranque.log; exit 1
            fi
            sleep 2
          done
          echo "Tiempo de espera agotado durante el arranque:"; cat arranque.log
          kill $PID 2>/dev/null || true
          exit 1

      - name: Publicar bitacora del arranque
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arranque-migraciones
          path: backend/arranque.log
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilacion de produccion
        run: npm run build

      - name: Pruebas unitarias
        run: npm test -- --watch=false

  imagenes:
    name: Construccion de imagenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen del backend
        run: docker build -t sgai-api:ci ./backend

      - name: Construir imagen del frontend
        run: docker build -t sgai-web:ci ./frontend
