# Entorno completo del SGAI-CID: base de datos, API y aplicacion web.
# Uso: copiar .env.example a .env, ajustar los valores y ejecutar
#   docker compose up -d --build
services:
  base-datos:
    image: postgres:17-alpine
    container_name: sgai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgai}
      POSTGRES_USER: ${POSTGRES_USER:-sgai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      # Colacion peruana para ordenar nombres de productos con tildes.
      LANG: es_PE.UTF-8
      TZ: America/Lima
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sgai} -d ${POSTGRES_DB:-sgai}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: sgai-api
    depends_on:
      base-datos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SGAI_DB_URL: jdbc:postgresql://base-datos:5432/${POSTGRES_DB:-sgai}
      SGAI_DB_USER: ${POSTGRES_USER:-sgai}
      SGAI_DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      SGAI_JWT_SECRET: ${SGAI_JWT_SECRET:?defina SGAI_JWT_SECRET en .env}
      SGAI_CORS_ORIGINS: ${SGAI_CORS_ORIGINS:-http://localhost:8081}
      TZ: America/Lima
    ports:
      - '${API_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/actuator/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    container_name: sgai-web
    depends_on:
      api:
        condition: service_started
    environment:
      TZ: America/Lima
    ports:
      - '${WEB_PORT:-8081}:8080'
    restart: unless-stopped

volumes:
  datos-postgres:
