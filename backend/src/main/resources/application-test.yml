spring:
  datasource:
    url: jdbc:h2:mem:sgai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS sgai
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: sgai
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
