<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <title>SGAI-CID · Control de almacen</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
        content="Sistema de gestion de almacen e inventarios de Corporacion Integral de Dialisis S.A.C.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#042f2e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
  <script>
    // Se aplica el tema antes de pintar para evitar el parpadeo de color.
    (function () {
      try {
        var guardado = localStorage.getItem('sgai.tema');
        var oscuro = guardado === 'dark'
          || (!guardado && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', oscuro);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
      } catch (e) {
        /* almacenamiento no disponible: se usa el tema claro */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Este sistema requiere JavaScript habilitado.</noscript>
</body>
</html>
